name: Renovate
on:
  schedule:
    - cron: "0 23 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: renovatebot/github-action@v46.3.8
        with:
          configurationFile: renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
